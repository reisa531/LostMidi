name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Copy only the standalone frontend project
        run: cp -R frontend "$RUNNER_TEMP/lostmidi-frontend"
      - name: Install and verify without the backend or parent files
        working-directory: ${{ runner.temp }}/lostmidi-frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run check
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Configure disposable administrator credentials
        run: |
          python3 - <<'PY'
          import hashlib, os, secrets
          password = secrets.token_urlsafe(32)
          salt = secrets.token_bytes(16)
          digest = hashlib.pbkdf2_hmac('sha256', password.encode(), salt, 600000).hex()
          password_hash = f'pbkdf2_sha256:600000:{salt.hex()}:{digest}'
          print(f'::add-mask::{password}')
          print(f'::add-mask::{password_hash}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ADMIN_USERNAME=ci-admin\nADMIN_TEST_USERNAME=ci-admin\nADMIN_TEST_PASSWORD={password}\nADMIN_PASSWORD_HASH={password_hash}\n')
          PY
      - name: Build and start (backend build runs GoogleTest)
        run: docker compose --env-file .env.example up --build --wait --wait-timeout 180
      - name: Database constraints
        run: docker compose --env-file .env.example run --rm migrate psql -X -v ON_ERROR_STOP=1 -f /database/tests/constraints.sql
      - name: API and rendered page checks
        run: python3 scripts/smoke.py
      - name: People and credit write checks
        run: python3 scripts/people_smoke.py --allow-writes
      - name: Historical source and recovery write checks
        run: python3 scripts/recovery_smoke.py --allow-writes
      - name: Administrator session and archive regression checks
        run: python3 scripts/admin_smoke.py --allow-writes
      - name: One-time installation on a separate fresh database
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets, subprocess, time, urllib.error, urllib.parse, urllib.request
          compose = ['docker', 'compose', '--env-file', '.env.example']
          example = dict(line.split('=', 1) for line in pathlib.Path('.env.example').read_text().splitlines() if line and not line.startswith('#'))
          token = secrets.token_urlsafe(32)
          print(f'::add-mask::{token}', flush=True)
          url = urllib.parse.urlsplit(example['DATABASE_URL'])
          database_url = urllib.parse.urlunsplit(url._replace(path='/lostmidi_install_check'))
          env = {**os.environ, 'DATABASE_URL': database_url, 'INSTALLATION_TOKEN': token, 'INSTALLATION_TEST_TOKEN': token}
          name = 'lostmidi-installation-check'
          def run(*args, **kwargs):
              subprocess.run([*compose, *args], check=True, **kwargs)
          run('exec', '-T', 'postgres', 'sh', '-c', 'createdb -U "$POSTGRES_USER" lostmidi_install_check')
          run('run', '--rm', '--no-deps', '-e', 'PGDATABASE=lostmidi_install_check', '-e', 'SEED_DEMO=false', 'migrate')
          try:
              run('run', '-d', '--no-deps', '--name', name, '-p', '127.0.0.1:18080:8080',
                  '-e', 'DATABASE_URL', '-e', 'INSTALLATION_TOKEN', '-e', 'ADMIN_USERNAME=', '-e', 'ADMIN_PASSWORD_HASH=', 'backend', env=env)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              deadline = time.monotonic() + 60
              while True:
                  try:
                      with opener.open('http://127.0.0.1:18080/ready', timeout=3) as response:
                          if response.status == 200:
                              break
                  except (OSError, urllib.error.URLError):
                      pass
                  if time.monotonic() >= deadline:
                      raise RuntimeError('Installation test backend did not become ready')
                  time.sleep(.5)
              subprocess.run(['python3', 'scripts/installation_smoke.py', '--api', 'http://127.0.0.1:18080', '--allow-install'], env=env, check=True)
          finally:
              subprocess.run(['docker', 'rm', '-f', name], check=False)
          PY
      - name: Diagnostic logs
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop services
        if: always()
        run: docker compose --env-file .env.example down
